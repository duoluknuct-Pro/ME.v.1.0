<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EO Central - Event & Rundown Manager (GitHub Pages)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f3ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#1e1b4b',
                            dark: '#0b0f19',
                            card: '#151c2c',
                            border: '#242f47'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Bootstrap Icons & SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(21, 28, 44, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen flex flex-col antialiased">

    <!-- Top Bar Navigation -->
    <header class="sticky top-0 z-40 bg-brand-card/90 border-b border-brand-border backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-2">
                        <div class="p-2 bg-indigo-600 rounded-xl text-white"><i class="bi bi-calendar2-event text-xl"></i></div>
                        <span class="text-xl font-bold tracking-tight text-white">EO<span class="text-indigo-400">CENTRAL</span></span>
                    </div>
                    <select id="activeProjectSelect" onchange="changeActiveProject(this.value)" class="bg-slate-900 border border-brand-border text-sm text-indigo-200 rounded-lg p-2 font-medium">
                        <option value="">-- Pilih Proyek --</option>
                    </select>
                </div>
                <div class="flex items-center space-x-3">
                    <div class="flex items-center space-x-1 px-3 py-1.5 rounded-full text-xs font-semibold bg-emerald-950/80 text-emerald-400 border border-emerald-800">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span>GitHub Pages & Sheets Synced</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="flex-1 flex max-w-7xl w-full mx-auto px-4 py-6 gap-6">
        <main class="flex-1 min-w-0 space-y-6">
            <!-- Dashboard Section -->
            <section id="tab-dashboard" class="tab-content space-y-6">
                <div class="glass-panel p-6 rounded-2xl border border-brand-border flex justify-between items-center">
                    <div>
                        <h1 id="dashProjectTitle" class="text-2xl font-bold text-white">Memuat Data...</h1>
                        <p id="dashProjectSubtitle" class="text-gray-400 text-sm">Menghubungkan ke Google Sheets backend...</p>
                    </div>
                    <button onclick="openProjectModal()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium shadow-lg">
                        <i class="bi bi-plus-lg mr-2"></i> Buat Proyek Baru
                    </button>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal Proyek -->
    <div id="projectModal" class="fixed inset-0 z-50 hidden bg-black/70 flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-md p-6 rounded-2xl border border-brand-border space-y-4">
            <h3 class="text-lg font-bold text-white">Buat Proyek Baru</h3>
            <form id="projectForm" onsubmit="handleProjectSubmit(event)" class="space-y-3">
                <input type="hidden" id="projId">
                <div><label class="text-xs text-gray-300">Nama Proyek</label><input type="text" id="projName" required class="w-full bg-slate-900 border border-brand-border rounded-lg p-2.5 text-sm text-white"></div>
                <div><label class="text-xs text-gray-300">Klien</label><input type="text" id="projClient" required class="w-full bg-slate-900 border border-brand-border rounded-lg p-2.5 text-sm text-white"></div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="text-xs text-gray-300">Tgl Mulai</label><input type="date" id="projStartDate" required class="w-full bg-slate-900 border border-brand-border rounded-lg p-2.5 text-sm text-white"></div>
                    <div><label class="text-xs text-gray-300">Tgl Selesai</label><input type="date" id="projEndDate" required class="w-full bg-slate-900 border border-brand-border rounded-lg p-2.5 text-sm text-white"></div>
                </div>
                <div><label class="text-xs text-gray-300">Lokasi</label><input type="text" id="projLocation" required class="w-full bg-slate-900 border border-brand-border rounded-lg p-2.5 text-sm text-white"></div>
                <div><label class="text-xs text-gray-300">Status</label><select id="projStatus" class="w-full bg-slate-900 border border-brand-border rounded-lg p-2.5 text-sm text-white"><option value="Draft">Draft</option><option value="Live">Live</option></select></div>
                <div class="flex justify-end space-x-2 pt-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-800 text-gray-300 rounded-lg text-xs">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-xs font-semibold">Simpan ke Sheets</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Koneksi Fetch API -->
    <script>
        // 💡 Ganti URL di bawah ini dengan Web App URL hasil Deploy Google Apps Script Anda!
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzn3P10zqi0ojT2nJNwabFKxLJefSend4dT4fRzcX57uqpbLnoptBysUEmsXFLe00g5/exec"; 

        let state = { activeProjectId: null, projects: [], rundowns: [], tasks: [], crew: [] };

        window.addEventListener('DOMContentLoaded', () => {
            fetchAllData();
        });

        function fetchAllData() {
            Swal.fire({ title: 'Memuat data dari Sheets...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            
            fetch(`${GAS_WEB_APP_URL}?action=getAllAppData`)
                .then(res => res.json())
                .then(data => {
                    state.projects = data.projects || [];
                    state.rundowns = data.rundowns || [];
                    state.tasks = data.tasks || [];
                    state.crew = data.crew || [];

                    if (state.projects.length > 0 && !state.activeProjectId) {
                        state.activeProjectId = state.projects[0].ProjectID;
                    }

                    renderDropdowns();
                    renderDashboard();
                    Swal.close();
                })
                .catch(err => {
                    Swal.fire('Error', 'Gagal terhubung ke backend Sheets: ' + err, 'error');
                });
        }

        function renderDropdowns() {
            const selectEl = document.getElementById('activeProjectSelect');
            if (!state.projects.length) {
                selectEl.innerHTML = `<option value="">-- Belum Ada Proyek --</option>`;
                return;
            }
            selectEl.innerHTML = state.projects.map(p => `<option value="${p.ProjectID}" ${p.ProjectID === state.activeProjectId ? 'selected' : ''}>${p.NamaProyek}</option>`).join('');
        }

        function renderDashboard() {
            const activeProj = state.projects.find(p => p.ProjectID === state.activeProjectId);
            if (!activeProj) {
                document.getElementById('dashProjectTitle').innerText = "Belum Ada Proyek Aktif";
                document.getElementById('dashProjectSubtitle').innerText = "Silakan buat proyek baru.";
                return;
            }
            document.getElementById('dashProjectTitle').innerText = activeProj.NamaProyek;
            document.getElementById('dashProjectSubtitle').innerText = `Klien: ${activeProj.Klien} | Lokasi: ${activeProj.Lokasi}`;
        }

        function openProjectModal() { document.getElementById('projectModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('projectModal').classList.add('hidden'); }

        function handleProjectSubmit(e) {
            e.preventDefault();
            const newP = {
                ProjectID: 'PRJ-' + Date.now(),
                NamaProyek: document.getElementById('projName').value,
                Klien: document.getElementById('projClient').value,
                TanggalMulai: document.getElementById('projStartDate').value,
                TanggalSelesai: document.getElementById('projEndDate').value,
                Lokasi: document.getElementById('projLocation').value,
                Status: document.getElementById('projStatus').value
            };

            Swal.fire({ title: 'Menyimpan ke Google Sheets...', didOpen: () => Swal.showLoading() });

            fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'saveData', sheetName: 'Projects', data: newP, idFieldName: 'ProjectID' })
            })
            .then(res => res.json())
            .then(res => {
                if (res.success) {
                    closeModal();
                    fetchAllData();
                    Swal.fire('Berhasil!', 'Proyek tersimpan secara online di Sheets.', 'success');
                } else {
                    Swal.fire('Gagal', res.error || 'Terjadi kesalahan', 'error');
                }
            })
            .catch(err => Swal.fire('Error', err.toString(), 'error'));
        }
    </script>
</body>
</html>
